- name: Caddy
  block:
    - name: Clear previous files
      shell: "rm -rf /root/.ssh"

    - name: Pull caddy files from backup
      environment:
        BORG_RSH: "{{ BORG_RSH }}"
        BORG_REPO: "{{ BORG_REPO }}"
        BORG_PASSPHRASE: "{{ BORG_PASSPHRASE }}"
      shell:
        cmd: "borg extract --strip-components 2 -v --list {{ BORG_REPO }}::{{ VERSION }} /root/.ssh"
        chdir: "/root"