- name: Caddy
  block:
    - name: Clear previous files
      shell: "rm -rf {{ caddyfolder }}/*"

    - name: Pull caddy files from backup
      environment:
        BORG_RSH: "{{ BORG_RSH }}"
        BORG_REPO: "{{ BORG_REPO }}"
        BORG_PASSPHRASE: "{{ BORG_PASSPHRASE }}"
      shell:
        cmd: "borg extract --strip-components 2 -v --list {{ BORG_REPO }}::{{ VERSION }} {{ caddyfolder }}"
        chdir: "{{ caddyfolder }}"

    - name: Pull caddy files from backup
      environment:
        BORG_RSH: "{{ BORG_RSH }}"
        BORG_REPO: "{{ BORG_REPO }}"
        BORG_PASSPHRASE: "{{ BORG_PASSPHRASE }}"
      shell:
        cmd: "borg extract --strip-components 9 -v --list {{ BORG_REPO }}::{{ VERSION }} /var/lib/caddy/.local/share/caddy/pki/authorities/local"
        chdir: "/var/lib/caddy/.local/share/caddy/pki/authorities"

    - name: Change permissions to root
      file:
        path: "{{ caddyfolder }}"
        state: directory
        recurse: yes
        owner: root
        group: root