- name: Caddy
  block:
    - name: Clear previous files
      shell: "rm -rf {{ caddyfolder }}/*"

    - name: Pull caddy files from backup
      environment:
        BORG_RSH: "{{ BORG_RSH }}"
        BORG_REPO: "{{ BORG_REPO }}"
        BORG_PASSPHRASE: "{{ BORG_PASSPHRASE }}"
        BORG_RELOCATED_REPO_ACCESS_IS_OK: "yes"
      shell:
        cmd: "borg extract --strip-components 2 -v --list {{ BORG_REPO }}::{{ VERSION }} {{ caddyfolder }}"
        chdir: "{{ caddyfolder }}"

    - name: Pull caddy files from backup
      environment:
        BORG_RSH: "{{ BORG_RSH }}"
        BORG_REPO: "{{ BORG_REPO }}"
        BORG_PASSPHRASE: "{{ BORG_PASSPHRASE }}"
        BORG_RELOCATED_REPO_ACCESS_IS_OK: "yes"
      shell:
        cmd: "borg extract --strip-components 3 -v --list {{ BORG_REPO }}::{{ VERSION }} /var/lib/caddy"
        chdir: "/var/lib/caddy"