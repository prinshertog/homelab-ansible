- name: Start podman    
  block:  
    - name: Enable lingering for dockeruser
      ansible.builtin.command: loginctl enable-linger dockeruser
      args:
        creates: /var/lib/systemd/linger/dockeruser
    
    - name: Start podman compose socket
      ansible.builtin.systemd_service:
        name: podman.socket
        state: started
        scope: user
        enabled: true
      become: true
      become_user: dockeruser
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ dockeruser_uid }}"

    - name: Start containers
      ansible.builtin.shell:
        cmd: "cd /opt/docker/{{ item }} && podman compose up -d"
      loop: "{{ containers }}"
      become: true
      become_user: dockeruser